site: Daniel McSheehy
url: https://danielmcsheehy.github.io
title: Daniel McSheehy
description: Software Engineer — robotics, distributed systems, and AI agents.
googlewebfonts: Fira+Code:wght@400;500;700
twitter:
  username:
  card: summary
  creator:
author:
  twitter:
  name: Daniel McSheehy
  avatar:
  email: danielmcsheehy@protonmail.com
  url: https://danielmcsheehy.github.io
permalink: pretty

baseurl: ""

highlighter: rouge

exclude:
  - .jekyll-cache
  
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]

sass:
  sass_dir:          _sass
  style:            :compressed

plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  pages:
    output: true
    permalink: /:name
  posts:
    output: true
    permalink: /:year/:month/:day/:slug
  
defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"